name: PhotoshopToSpine source integrity

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'photoshop/**'
      - '.github/workflows/source-integrity.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'photoshop/**'
      - '.github/workflows/source-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    name: Verify v7.54 source and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Photoshop target and pinned script version
        shell: bash
        run: |
          set -euo pipefail
          source_file='photoshop/PhotoshopToSpine_v7.54_SYMBIOTYC.jsx'
          test -s "$source_file"
          grep -Fqx '#target photoshop' <(head -n 1 "$source_file")
          grep -Fq 'var scriptVersion = "7.54";' "$source_file"

      - name: Verify pinned source blob identity
        shell: bash
        run: |
          set -euo pipefail
          source_file='photoshop/PhotoshopToSpine_v7.54_SYMBIOTYC.jsx'
          expected_blob='f5e5b36ade492d7d0a526cd013699a9cb5340ed6'
          actual_blob="$(git hash-object "$source_file")"
          test "$actual_blob" = "$expected_blob"

      - name: Verify original BSD attribution and disclaimer
        shell: bash
        run: |
          set -euo pipefail
          source_file='photoshop/PhotoshopToSpine_v7.54_SYMBIOTYC.jsx'
          grep -Fq 'Copyright (c) 2012-2022, Esoteric Software' "$source_file"
          grep -Fq 'All rights reserved.' "$source_file"
          grep -Fq 'Redistribution and use in source and binary forms' "$source_file"
          grep -Fq 'Neither the name of Esoteric Software' "$source_file"
          grep -Fq 'THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS "AS IS"' "$source_file"

      - name: Verify documentation does not claim runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'not yet executed in Adobe Photoshop or validated in Spine Editor' photoshop/README.md
          grep -Fq 'has **not** yet been run in Adobe Photoshop' README.md
