name: Public runner secret capability check
on:
  push:
    paths:
      - '.github/workflows/public-runner-secret-capability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report configured secret names only
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SPINE_LICENSE: ${{ secrets.SPINE_LICENSE }}
          SPINE_LINUX_URL: ${{ secrets.SPINE_LINUX_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for key in SOURCE_REPO_TOKEN ACCESS_TOKEN SPINE_LICENSE SPINE_LINUX_URL; do
            if [ -n "${!key}" ]; then
              echo "$key=available" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$key=missing" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
